version: "v0.4"

project:
  name: "hadamard-b-formal: the bordered Goethals-Seidel characterisation, the s=1 layer, and Theorem D"
  description: >-
    A Lean 4 and Mathlib formalization of part of the theorem layer of the
    Hadamard-B note on bordered Goethals-Seidel arrays: twenty-six compared
    theorems over fifty-eight compared definitions. Theorem A characterises, by
    an if-and-only-if, when a Goethals-Seidel array of four sign-valued
    sequences over a finite abelian group extends to a Hadamard matrix through
    a border of width 4s whose strips are constant on the cosets of a subgroup.
    Theorem B is its house
    form, whose hypothesis is exactly a two-tier periodic-autocorrelation
    profile, and carries two classical degenerations at an arbitrary reflection
    shift: the Goethals-Seidel theorem over an arbitrary finite abelian group,
    and the Wallis-Whiteman/Spence bordered construction. Of Theorem C only the
    row-sum rows D5 and D6 are formalized; clauses D1-D4 and the classification
    corollary are not. The character-twist layer is Lemma T, the s = 1 profile
    bijection, and the theorem that a twist fixing the reflection shift is a
    diagonal conjugation. Theorem D is covered at clauses (D-a) through (D-e):
    the forced Gram and border tables, the collapse of (H4) to a single 4x4
    equation, the integer Parseval identity, both directions of the transport
    across the doubling, and clause (D-a'), which identifies the degenerate
    branch with the index-one construction entry for entry, again in both
    directions. The index-two collapse corollary is represented by its
    seed-problem bijection clause alone; its characteristic-subgroup and
    equivariance clauses are not formalized, nor is the 768-squared census
    behind (D-e). Two witness records are imported under SHA-256 pins,
    cross-checked against the source's canonical matrix digests, and checked by
    kernel reduction against Theorem A's hypotheses, giving Hadamard matrices
    of orders 52 and 20 through the theorem rather than by matrix
    multiplication; no novelty of existence is claimed at either order.
  authors:
    - "JD Jones"
  license: "MIT"
  responsible_maintainers:
    - "JD Jones"

classification:
  arxiv:
    - "math.CO"
  msc2020:
    - "05B20"

sources:
  - title: "Hadamard-B: bordered Goethals-Seidel arrays - characterisation, classification, and three equivalence classes at order 668"
    authors:
      - "JD Jones"
    id: "https://github.com/JD-Jones-ASES/Hadamard-B/tree/01a7f0614208ca68d69e64a7cd5b560aadafbb8a"
    type: "other"
    location: >-
      note/NOTE-B.md sections 1.0-1.6 and 2.2; data/h52-gate.json (SHA-256
      ef60c4ff9f245eec5ba7f035e5968152836207fcd9235a0b1851150d2fb1d170) and
      data/h20-boundary.json (SHA-256
      716610543b79ab9e1c9f1adb142c114544e70e58d370500130b83c17a18cf254)
    relationship: "formalizes"
    note: >-
      Carries the statements and paper-grade proofs formalized here: the
      border ansatz and its notation (section 1.0), Theorem A (1.1), Theorem B
      and its degenerations (1.2), the row-sum rows D5 and D6 of Theorem C
      (1.3), Lemma T and the conjugation proposition (1.4), Theorem D (1.5),
      and the index-2 collapse corollary (1.6). Section 2.2 describes the two
      instance records this repository's exporter pins: the H(52) Theorem-D
      gate (cert 03) and the H(20) w = 2s boundary instance T1 (cert 05). The
      note's own labels record which claims are paper-grade proofs and which
      rest on certificates; this formalization covers part of the former.
      ACCESSIBILITY: the repository is public as of 2026-09-01 and the pinned
      commit resolves without authentication (verified the same day). The
      account here is nonetheless self-contained: the README gives a
      plain-language account of every compared theorem and Challenge.lean gives
      every compared definition its intended value, so the exact claim can be
      identified and assessed without reaching the source. Claims about the
      source's own results - its certificates, its searches, its prior-art
      statements - rest on the source and count towards nothing else.
    author_endorsement: "participated"
  - title: "A skew Hadamard matrix of order 36"
    authors:
      - "J. M. Goethals"
      - "J. J. Seidel"
    id: "J. Austral. Math. Soc. 11 (1970) 343-344"
    type: "paper"
    location: "the four-block array"
    relationship: "background"
    note: >-
      The Goethals-Seidel array itself - four group-developed blocks with a
      back-diagonal reflection - is theirs. The source note fixes this credit
      by a firsthand read (NOTE-B section 4.1).
  - title: "Some classes of Hadamard matrices with constant diagonal"
    authors:
      - "J. Wallis"
      - "A. L. Whiteman"
    id: "Bull. Austral. Math. Soc. 7 (1972) 233-249"
    type: "paper"
    location: "Theorem 11 (p. 242) and Theorem 12 (p. 243)"
    relationship: "background"
    note: >-
      The general-abelian setting is theirs: the type-1/type-2 incidence
      calculus over an arbitrary additive abelian group, Theorem 11 (the
      unbordered array over general abelian G, formalized here as
      goethalsSeidel_abelian) and Theorem 12 (the classical width-4 border,
      formalized here as borderedGS_index_one). Nothing about the abelian
      setting is claimed by the source note.
  - title: "Hadamard matrices from relative difference sets"
    authors:
      - "E. Spence"
    id: "J. Combin. Theory Ser. A 19 (1975) 287-300"
    type: "paper"
    location: "Theorem 2.1 (p. 289)"
    relationship: "background"
    note: >-
      The even-order cyclic sibling of the classical s = 1 bordered
      construction, with blocks from Elliott-Butson relative difference sets.
      Together with Wallis-Whiteman Theorem 12 it is the classical content of
      borderedGS_index_one.
  - title: "The Dokovic-Kotsireas compression device (two papers)"
    authors:
      - "D. Z. Dokovic"
      - "I. S. Kotsireas"
    id: "arXiv:1302.0571 and arXiv:1801.07627"
    type: "paper"
    location: "arXiv:1302.0571 Def. 3 and Thm 3 (cyclic); arXiv:1801.07627 section 7, Lemma 3 and Thm 4 (general abelian)"
    relationship: "background"
    note: >-
      The compression device - summing a sequence over the cosets of a
      subgroup, and the induced autocorrelation identity - is theirs, at full
      abelian generality in the second paper. The source note's Lemma 3, which
      this development formalizes internally as the coset-sum transport behind
      hypothesis (H4), adds only the matrix-level bookkeeping that the
      compressed core is again a Goethals-Seidel array over G/K, reflection
      included.


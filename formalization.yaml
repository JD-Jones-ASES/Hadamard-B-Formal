status:
  scope: >-
    Formalized and compared: Theorem A in both directions and its sufficiency
    half separately; Theorem B (the house profile); the classical
    Goethals-Seidel theorem over an abelian group and the
    Wallis-Whiteman/Spence bordered construction, both at an arbitrary
    reflection shift; the row-sum rows D5 and D6; Lemma T, the s = 1 profile
    bijection, the psi(rho) = 1 conjugation and its Hadamard-iff corollary;
    Theorem D clauses (D-a)/(D-b) (the forced Gram table and pair-negated
    column table), (D-c) (the forced row table and Hadamard corner), (D-d)
    (the collapse of (H4) to a single 4x4 equation), the integer Parseval
    identity behind (D-d), clause (D-a') in full (the degenerate M = 4J branch
    collapses: both border tables pair up equal, the assembled matrix is the
    i = 1 assembly entry for entry, and (H1)-(H4) transport termwise, in both
    directions), and both halves of the (D-e) transport, packaged as an
    exactly-when; the index-2 seed-problem bijection; and the two witness
    instances at orders 52 and 20 with their existence corollaries. That is
    twenty-six compared theorems over fifty-eight compared definitions, and on
    that surface it is a complete resolution of the s = 1, i = 2 border system
    in the sense of Theorem D's own clauses - subject to the two exclusions
    named next in the same breath. Not formalized: Theorem C's forced
    parameter clauses D1-D4 and the classification corollary that reads them
    off (they need positive semidefiniteness and rank over the reals and
    character orthogonality over the complexes; only D5 and D6 are in scope);
    the characteristic-subgroup and automorphism-equivariance clauses of the
    index-2 collapse corollary (NOTE-B section 1.6); the 768-squared census of
    (D-e), which is a Python certificate in the source repository (its cert 10,
    labelled PROVEN-BY-CERTIFICATE there), not a theorem here; and the
    section-3 separation theorem at order 668 and its invariants - the exact
    4-profile computations behind those are not formalized here, are outside
    this registration's scope, and are impractical under direct kernel
    reduction. Every statement is for the note's standard orientation only:
    the companion order-20 instance T2 declares the transpose-negated
    orientation and the exporter refuses to emit it. The quotient G/K is
    modelled as a surjective additive hom rather than as a quotient type.
    Deliberate proof holes occur only in Challenge.lean and are excluded from
    the solution axiom audit; the sorry_count fields count the solution side
    (Solution.lean and the proof library), where the count is zero.

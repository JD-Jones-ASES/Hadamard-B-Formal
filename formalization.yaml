automation:
  methods:
    - method: "agent"
      models:
        - "Claude Code (Fable 5)"
        - "Claude Opus (subagent lanes)"
      framework: "multi-agent workflow (plan lane, staged implementation lanes, adversarial audit)"
      tool_setup: >-
        A planning lane produced a source-controlled pour plan against the
        pinned Mathlib tree; staged implementation lanes poured the library in
        the plan's order, each stage gated on a green build with zero sorries
        outside Challenge.lean; an adversarial audit lane reviewed statements
        against the source note. Exact-data import is guarded by SHA-256 pins
        and a deterministic standard-library-only exporter, the concrete
        hypotheses of Theorem A are checked by kernel reduction with decide and
        never native_decide, and the public proof closure is checked at build
        time with Lean.collectAxioms.
      prompting_notes: >-
        The compared surface was fixed by an owner ruling before packaging and
        the public challenge was restricted to the theorem statements and the
        definitions those statements depend on for their meaning, including
        the two pinned instance records.
  spend_usd: "not tracked"
  notes: >-
    AI systems generated and audited the mathematics and the Lean code; JD
    Jones directed the work and is the responsible author and maintainer. AI
    assistance is disclosed at the project level, in DISCLOSURE.md, and in the
    source repository.

fidelity:
  divergences: >-
    Statement-level. Every statement is for the note's standard orientation
    only; the transpose-negated companion instance T2 of the order-20 record is
    out of scope by construction and the exporter refuses to emit it. The
    quotient G/K is modelled as a surjective additive hom kappa : G -> Gbar
    rather than as a quotient type, with K = ker kappa, i = card Gbar and
    w = card K, and the constancy of the fiber size is taken as a hypothesis
    rather than derived from surjectivity; the border tables are indexed by
    Fin 4 x Gbar rather than by Fin (4i). Theorem C is represented only by its
    two row-sum rows D5 and D6: the forced-parameter clauses D1-D4 and the
    classification corollary are not formalized. Clause (D-a') is stated with
    the trivial quotient carried as any additive hom into a subsingleton type,
    matching borderedGS_subsingleton, and the doubling of an i = 1 border is
    encoded by the two pair-equality hypotheses rather than by a separate
    doubling operator. The section-3 separation at order 668 is not formalized
    here; its exact 4-profile computations are outside this registration's
    scope and impractical under direct kernel reduction. Where the note writes Fin 4 for a corner at
    s = 1, several statements carry the definitionally equal Fin (4 * 1); this
    is cosmetic. Proof-level. theoremD_tables is proved by an integer route -
    U U-transpose = 4I upgrades to Matrix.IsHadamard, whose transpose-side
    field returns U-transpose U = 4I, and contracting the second row class
    against it forces M(1)^2 = 16 - rather than by the note's rank and
    positive-semidefiniteness argument over the reals; the statement is
    faithful and the proof route differs. theoremD_transport takes the note's
    (D-e) condition d = r as an explicit hypothesis, and takes the transported
    i = 1 system in the reduced border-equation form
    E1 Q1-transpose + P1 Lambda(r)-transpose = 0; theoremD_transport_converse
    supplies the missing direction - d = r is forced - and cancels the two 4x4
    Hadamard factors over the integers, through Q1 Q1-transpose = 4I,
    P1-transpose P1 = 4I and torsion-freeness, where the note inverts P1 over
    the rationals. deltaSqSum_eq_four is proved without surjectivity of kappa,
    which the note's Parseval phrasing assumes; its degenerate-branch companion
    deltaSqSum_degenerate does need the two fibers to have equal size, which is
    where the index enters. D5 hypothesises only the cardinality of the fiber
    over zero, that being all its proof uses: neither surjectivity of kappa,
    nor the index, nor the size of any other fiber enters, so it is stated more
    generally than the note's ambient setting. Several statements drop hypotheses the note's ambient
    setting carries, always in the strengthening direction: D5 and D6 do not
    assume w > 2s; lemmaT does not assume the character's kernel has index 2;
    theoremD_rowTable does not assume Q sign-valued (the pair-negation
    hypothesis suffices); and the section-1.5 statements other than
    theoremD_rowTable do not assume n >= 4, so theoremD_transport also covers
    the w = 1 case the note excludes as vacuous. NON-SURJECTIVE KAPPA.
    twist_profile_iff and collapse_seedProblem_bijection accept ANY additive
    hom kappa : G -> ZMod 2, where the note's profile bijection and its
    section-1.6 corollary begin from a character whose kernel has index two.
    This is a strengthening, not an error: for a non-surjective kappa the
    kernel is all of G, psi is identically 1, the twist is the identity, and
    both statements hold trivially with the "i = 2 profile" degenerating to the
    i = 1 profile. The index-two reading of these two theorems therefore
    applies to surjective kappa; the unrestricted object is a ZMod 2-coded
    profile, and the theorems are stated at the stronger generality rather than
    carrying a surjectivity hypothesis they do not need. Surjectivity of kappa in fact
    follows from the constant-fiber-size hypothesis (the fiber over zero is
    nonempty, so w >= 1, so every fiber is nonempty); theoremA states it
    explicitly for readability, and theoremA_sufficiency omits it.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude (Anthropic) - statement-fidelity audit lane, 2026-09-01"
    - "GPT 5.6 (OpenAI, Codex desk) - independent package review, 2026-09-01"
  notes: >-
    BOTH REVIEWS WERE PERFORMED BY AI SYSTEMS, AND NO INDEPENDENT HUMAN EXPERT
    REVIEW HAS OCCURRED. The Claude lane audited every compared statement
    against the source note's current text and produced the divergence list
    under fidelity.divergences. The Codex review was independent of that lane:
    it rebuilt the package from an isolated checkout of the tracked files with
    the pinned Lean 4.33.0 toolchain, replayed the transitive axiom audit over
    every compared declaration, re-ran the exporter in --check mode, and
    reviewed the publication surface; its findings were adjudicated and applied
    before this commit. JD Jones is the responsible owner, publisher and
    maintainer and appears in authors and responsible_maintainers; he is NOT a
    reviewer and made no mathematical contribution. What has actually been run
    locally: lake build, the build-time transitive axiom audit (propext,
    Classical.choice, Quot.sound only), the exporter determinism check, and the
    assembly cross-check against the source repository's canonical matrix
    digests. What has NOT been run: Palomar Comparator, lean4export, and
    NanoDa - no such tooling is installed on the machine that built this. A
    successful Palomar protected run would additionally establish that the
    recorded Solution satisfies the recorded Challenge and that the exported
    proof replays through Lean's kernel and the pinned NanoDa kernel. None of
    these checks, local or protected, establishes fidelity to the informal
    source, novelty, interest, or peer review; the source note's own prior-art
    and credit statements (NOTE-B section 4) are documentary claims resting on
    the sources cited there.


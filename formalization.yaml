  namespace: "HadamardBFormal"
  statements:
    - source: "NOTE-B section 1.1, Theorem A"
      lean: "HadamardBFormal.theoremA"
      module: "Solution"
      status: "proved"
      note: >-
        The exact characterisation, both directions: for a surjective kappa
        with all fibers of size w and sign-valued data, the bordered array is
        Hadamard if and only if (H1)-(H4) hold.
    - source: "NOTE-B section 1.1, Theorem A, sufficiency direction"
      lean: "HadamardBFormal.theoremA_sufficiency"
      module: "Solution"
      status: "proved"
      note: >-
        Stated with the surjectivity hypothesis omitted; it follows from the
        constant-fiber-size hypothesis in any case. This is the direction the
        two instance records consume.
    - source: "NOTE-B section 1.2, Theorem B"
      lean: "HadamardBFormal.theoremB_profile"
      module: "Solution"
      status: "proved"
      note: >-
        For the house Gram table, hypothesis (H2) is exactly the two-tier PAF
        profile 4n delta_0 - 4s [t in K minus 0] + 4 [t not in K]. The value
        at the origin comes from sign-valuedness alone.
    - source: "NOTE-B section 1.3, D5"
      lean: "HadamardBFormal.D5"
      module: "Solution"
      status: "proved"
      note: >-
        Summing the house profile over G gives the second moment of the row
        sums. The hypothesis is the cardinality of the fiber over zero alone -
        that is all the proof uses, so neither surjectivity of kappa nor the
        index nor any other fiber size is assumed.
    - source: "NOTE-B section 1.3, D6"
      lean: "HadamardBFormal.D6"
      module: "Solution"
      status: "proved"
      note: >-
        At index one, non-negativity of a sum of squares turns D5 into
        n(s-1) <= s. The note's reading that this kills i = 1 for s >= 2 once
        n >= 3 is prose; the inequality is what is formalized.
    - source: "NOTE-B section 1.2, the s = 0 degeneration (Wallis-Whiteman 1972, Theorem 11)"
      lean: "HadamardBFormal.goethalsSeidel_abelian"
      module: "Solution"
      status: "proved"
      note: >-
        The classical Goethals-Seidel theorem over an arbitrary finite abelian
        group, for every reflection shift rho rather than only the group
        inversion.
    - source: "NOTE-B section 1.2, the s = 1, i = 1 degeneration (Wallis-Whiteman Theorem 12; Spence 1975, Theorem 2.1)"
      lean: "HadamardBFormal.borderedGS_index_one"
      module: "Solution"
      status: "proved"
      note: "The classical width-4 bordered construction, at an arbitrary reflection shift."
    - source: "NOTE-B section 1.4, Lemma T"
      lean: "HadamardBFormal.lemmaT"
      module: "Solution"
      status: "proved"
      note: "PAF of the psi-twist is psi(t) times PAF, for a character with psi squared = 1."
    - source: "NOTE-B section 1.4, the profile bijection"
      lean: "HadamardBFormal.twist_profile_iff"
      module: "Solution"
      status: "proved"
      note: >-
        At s = 1 a quadruple satisfies the index-1 profile if and only if its
        twist satisfies the index-2 profile.
    - source: "NOTE-B section 1.4, Proposition (a twist with psi(rho) = 1 is a diagonal conjugation)"
      lean: "HadamardBFormal.twist_isConjugation"
      module: "Solution"
      status: "proved"
      note: "The twisted bordered instance is S H S with S = diag(I, I4 tensor diag psi)."
    - source: "NOTE-B section 1.4, the corollary of the conjugation proposition"
      lean: "HadamardBFormal.twist_isHadamard_iff"
      module: "Solution"
      status: "proved"
      note: >-
        Hence a psi(rho) = 1 twist manufactures nothing new: the twisted border
        is Hadamard exactly when the original is.
    - source: "NOTE-B section 1.5, Theorem D, clauses (D-a) and (D-b)"
      lean: "HadamardBFormal.theoremD_tables"
      module: "Solution"
      status: "proved"
      note: >-
        M(0) = 4 and M(1) = plus or minus 4; in the genuine branch M(1) = -4
        the column table pair-negates onto a 4x4 Hadamard matrix. Proved over
        the integers rather than by the note's rank and PSD argument.
    - source: "NOTE-B section 1.5, Theorem D, clause (D-c)"
      lean: "HadamardBFormal.theoremD_rowTable"
      module: "Solution"
      status: "proved"
      note: >-
        The row table pair-negates, and both the reduced row table and the
        corner E are 4x4 Hadamard matrices. Sharper than D3: w >= 2 suffices.
    - source: "NOTE-B section 1.5, Theorem D, clause (D-d)"
      lean: "HadamardBFormal.theoremD_border"
      module: "Solution"
      status: "proved"
      note: >-
        Hypothesis (H4) collapses to the single 4x4 equation 4E = -p
        Lambda(d)-transpose U, the integer form of the note's E = -(1/4) p
        Lambda(d)-transpose U.
    - source: "NOTE-B section 1.5, the Parseval step of (D-d)"
      lean: "HadamardBFormal.deltaSqSum_eq_four"
      module: "Solution"
      status: "proved"
      note: >-
        The sum of the squared twisted row sums is 4. At index two the binding
        character is integer valued, so this is a pure integer identity; the
        proof uses neither surjectivity of kappa nor the fiber size.
    - source: "NOTE-B section 1.5, the transport clause of (D-e)"
      lean: "HadamardBFormal.theoremD_transport"
      module: "Solution"
      status: "proved"
      note: >-
        Doubling an index-1 border and twisting the seeds gives a valid index-2
        instance, under the note's condition d = r, which is carried here as an
        explicit hypothesis and is automatic in the epsilon = +1 branch.
    - source: "NOTE-B section 1.5, (D-e) transport, converse direction"
      lean: "HadamardBFormal.theoremD_transport_converse"
      module: "Solution"
      status: "proved"
      note: >-
        The note's condition d = r is forced, not assumed: if the doubled
        tables satisfy (H4) at index two then the transported system reads
        P1 Lambda(d)-transpose Q1 = P1 Lambda(r)-transpose Q1, and cancelling
        the two 4x4 Hadamard factors over the integers leaves Lambda(d) =
        Lambda(r), with Lambda injective.
    - source: "NOTE-B section 1.5, (D-e) transport, the exactly-when"
      lean: "HadamardBFormal.theoremD_transport_iff"
      module: "Solution"
      status: "proved"
      note: >-
        The two halves packaged: the doubled border is Hadamard if and only if
        d = r. The forward direction routes the Hadamard hypothesis through
        Theorem A to recover (H4) at index two; equal nonempty fibers make
        kappa surjective, so no extra hypothesis is needed.
    - source: "NOTE-B section 1.5, clause (D-a prime)"
      lean: "HadamardBFormal.theoremD_degenerate_collapse"
      module: "Solution"
      status: "proved"
      note: >-
        The degenerate branch M(1) = +4 collapses onto the index-1
        construction: Q pairs up equal, P pairs up equal, the assembled matrix
        equals the index-1 assembly entry for entry, and (H1)-(H4) transport
        termwise onto the collapsed tables over a trivial quotient - (H1) with
        M1 = (4), (H2) the index-1 profile, (H3) at fiber size n rather than w,
        (H4) the index-1 border equation with the row-sum vector r where the
        genuine branch has the twisted vector d. The engine is the
        degenerate-branch Parseval sum_q delta_q^2 = N, which makes Lambda(d)
        nonsingular and kills the column differences of P - the exact mirror of
        (D-c), where Lambda(r) is inverted and the column sums die.
    - source: "NOTE-B section 1.5, clause (D-a prime), converse direction"
      lean: "HadamardBFormal.theoremD_degenerate_converse"
      module: "Solution"
      status: "proved"
      note: >-
        Conversely, doubling any index-1 border gives (H1)-(H4) with M = 4J and
        the same assembled matrix. Doubling is encoded by the two pair-equality
        hypotheses: tables over ZMod 2 that repeat each block along the two
        classes are precisely the doublings of their own collapsed tables. With
        the forward clause this is the note's bijection.
    - source: "NOTE-B section 1.6, Corollary (the seed-problem bijection clause)"
      lean: "HadamardBFormal.collapse_seedProblem_bijection"
      module: "Solution"
      status: "proved"
      note: >-
        The character twist is an involution, a bijection of sign-valued
        quadruples, and a bijection of the two s = 1 seed problems. It is a
        bijection of seed problems, not of matrices.
    - source: "NOTE-B section 2.2, cert 03 (the H(52) Theorem-D gate)"
      lean: "HadamardBFormal.hadamard_52_bordered"
      module: "Solution"
      status: "proved"
      note: >-
        The bordered array of the pinned gate record is Hadamard of order 52.
        The kernel checks O(n squared) hypotheses on a group of order 12; the
        52x52 product is never formed. No novelty of existence is claimed.
    - source: "NOTE-B section 2.2, cert 03, clauses (D-a)/(D-b) on the gate"
      lean: "HadamardBFormal.gate52_columnTable"
      module: "Solution"
      status: "proved"
      note: >-
        The gate realises the genuine branch: its column table pair-negates
        onto a 4x4 Hadamard matrix, read off theoremD_tables.
    - source: "NOTE-B section 2.2, cert 03"
      lean: "HadamardBFormal.hadamardExists_52"
      module: "Solution"
      status: "proved"
      note: "Existence at order 52, obtained from Theorem A applied to twelve-element data."
    - source: "NOTE-B section 2.2, cert 05, instance T1"
      lean: "HadamardBFormal.hadamard_20_bordered"
      module: "Solution"
      status: "proved"
      note: >-
        The w = 2s boundary record, with K the diagonal subgroup of Z2 x Z2
        rather than a coordinate kernel. Its companion T2 is transpose-negated
        and out of scope.
    - source: "NOTE-B section 2.2, cert 05, instance T1"
      lean: "HadamardBFormal.hadamardExists_20"
      module: "Solution"
      status: "proved"
      note: "Existence at order 20, from the boundary record. No novelty of existence is claimed."

